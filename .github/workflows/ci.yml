name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; setting it here
      # as well makes the action fail on a duplicate specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared package
        # Everything else typechecks against its emitted declarations.
        run: pnpm --filter @gameblade/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build server and web
        run: |
          pnpm --filter @gameblade/server build
          pnpm --filter @gameblade/web build

  docker:
    name: Build image
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gameblade:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # A container with no library configured must still boot and report healthy.
          docker run -d --name gameblade-ci -p 8080:8080 \
            -e SCAN_ON_START=false \
            gameblade:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "health check passed"
              curl -s http://127.0.0.1:8080/api/health
              echo
              # The web client must be bundled into the image, not just the API.
              curl -fsS http://127.0.0.1:8080/ | grep -q '<base href=' \
                && echo "web client served"
              docker rm -f gameblade-ci
              exit 0
            fi
            sleep 2
          done

          echo "container did not become healthy" >&2
          docker logs gameblade-ci
          docker rm -f gameblade-ci
          exit 1

  desktop:
    name: Build desktop client
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; setting it here
      # as well makes the action fail on a duplicate specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @gameblade/shared build

      - name: Rust formatting and lints
        working-directory: apps/desktop/src-tauri
        # This runner uses pwsh, which does not abort on a failing native
        # command, so each result is checked explicitly.
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installers
        run: pnpm --filter @gameblade/desktop build

      - uses: actions/upload-artifact@v4
        with:
          name: gameblade-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
