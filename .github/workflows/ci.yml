name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; setting it here
      # as well makes the action fail on a duplicate specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared package
        # Everything else typechecks against its emitted declarations.
        run: pnpm --filter @gameblade/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build server and web
        run: |
          pnpm --filter @gameblade/server build
          pnpm --filter @gameblade/web build

  docker:
    name: Build image
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gameblade:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          # A container with no library configured must still boot and report healthy.
          docker run -d --name gameblade-ci -p 8080:8080 \
            -e SCAN_ON_START=false \
            gameblade:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "health check passed"
              curl -s http://127.0.0.1:8080/api/health
              echo
              # The web client must be bundled into the image, not just the API.
              curl -fsS http://127.0.0.1:8080/ | grep -q '<base href=' \
                && echo "web client served"
              docker rm -f gameblade-ci
              exit 0
            fi
            sleep 2
          done

          echo "container did not become healthy" >&2
          docker logs gameblade-ci
          docker rm -f gameblade-ci
          exit 1

  desktop:
    name: Build desktop client
    runs-on: [self-hosted, windows, x64]
    # Manual only, because there is currently no Windows runner to pick it up.
    # A job queued for a label nothing answers to does not fail — it sits in the
    # queue looking pending until it times out hours later, and blocks the
    # merge in the meantime.
    #
    # Until a runner is back, the client is built with scripts/build-windows.ps1
    # on a real machine; see "Building a Windows release by hand" in the README.
    # Restoring the old behaviour is a one-line change back to
    # `github.event_name != 'push'`, which built on every pull request.
    if: github.event_name == 'workflow_dispatch'
    env:
      # CI proves the client compiles and its tests pass; the installer it
      # produces is a by-product nobody installs. Full LTO through a single
      # codegen unit is most of what makes a release build take the best part of
      # an hour, so the gate goes without it. publish.yml keeps the shipping
      # settings, so what actually reaches users is unchanged.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; setting it here
      # as well makes the action fail on a duplicate specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Replaces dtolnay/rust-toolchain@stable, which is a composite action
      # whose every step runs under `shell: bash`. A self-hosted Windows runner
      # has no bash on PATH unless Git's bin directory was added to it, and a
      # Windows service does not pick up a machine PATH change without a reboot
      # — so the toolchain is set up in PowerShell instead and the job stops
      # depending on the machine having been prepared a particular way.
      - name: Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-WebRequest's progress bar makes a download take minutes
          # instead of seconds on Windows PowerShell.
          $ProgressPreference = 'SilentlyContinue'

          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Write-Host 'rustup is not on PATH; installing it for this account'
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }

            # Available to the rest of this step, and to every step after it.
            $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
            $env:PATH = "$cargoBin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $cargoBin -Encoding utf8
          }

          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install exited with $LASTEXITCODE" }

          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "rustup default exited with $LASTEXITCODE" }

          rustc --version
          cargo --version

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @gameblade/shared build

      - name: Rust formatting and lints
        working-directory: apps/desktop/src-tauri
        # This runner uses pwsh, which does not abort on a failing native
        # command, so each result is checked explicitly.
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installers
        run: pnpm --filter @gameblade/desktop build

      - uses: actions/upload-artifact@v4
        with:
          name: gameblade-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
