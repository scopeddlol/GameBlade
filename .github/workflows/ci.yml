name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the client is worth building this time.
  #
  # The Windows job below bills at twice the Linux rate and takes a while, so it
  # is gated on whether anything it compiles actually changed. This job costs
  # seconds on the cheap runner to answer that, which is a good trade against
  # building a Tauri app to prove a change to the admin panel did not break it.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff against the base of the pull request.
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Anything the desktop client compiles: its own source, the transport
          # crate it links, and the types both ends share.
          watched='^(apps/desktop/|crates/gameblade-mesh/|packages/shared/)'

          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || true
            changed=$(git diff --name-only "$base"...HEAD)
          else
            # Not a pull request, so there is no base to compare against and no
            # safe way to guess one. Say yes and let the job's own condition
            # decide; on a push it is switched off anyway.
            changed=''
          fi

          if printf '%s\n' "$changed" | grep -qE "$watched"; then
            echo 'desktop=true' >> "$GITHUB_OUTPUT"
            echo 'client code changed; the desktop build will run'
          else
            echo 'desktop=false' >> "$GITHUB_OUTPUT"
            echo 'no client code changed; skipping the desktop build'
          fi

  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; setting it here
      # as well makes the action fail on a duplicate specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared package
        # Everything else typechecks against its emitted declarations.
        run: pnpm --filter @gameblade/shared build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build server and web
        run: |
          pnpm --filter @gameblade/server build
          pnpm --filter @gameblade/web build

  # The transport crate, on the cheap runner.
  #
  # Nothing else in CI covers it. The desktop job compiles it as a dependency
  # but lints and tests only its own package, and the Linux jobs above are
  # JavaScript. Which left a crate carrying the chunk protocol, the grant
  # checking and the relay entirely unverified by anything automatic — including
  # the tests that stand a real node and a real client up over localhost QUIC,
  # which are the ones most likely to catch a change that compiles and does not
  # work.
  mesh:
    name: Test the mesh crate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows as well as Linux, because the two disagree about sockets in a
        # way this crate is exactly the wrong place to find out about late.
        # `IPV6_V6ONLY` defaults off on Linux and on on Windows, so a `[::]`
        # bind is dual-stack on one and IPv6-only on the other — and the client
        # that seeds to other players runs on Windows only. A Linux-only gate
        # passed every test while that path could not receive an IPv4 packet.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/gameblade-mesh

      # Only once: they check the source, not the platform, and running them
      # twice only means being told the same thing twice.
      - name: Format and lint
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/gameblade-mesh
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: crates/gameblade-mesh
        run: cargo test

      # The binaries are what a node and a relay actually run, and a feature
      # only dev-dependencies provide has silently broken this before while
      # every test still passed.
      - name: Build the binaries
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/gameblade-mesh
        run: cargo build --release --bins

  docker:
    name: Build and smoke test the images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built one at a time and into one daemon, so the shared layers below the
      # role are compiled once and the other three targets are metadata on top.
      - name: Build the standalone image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          push: false
          load: true
          tags: gameblade:ci
          cache-from: type=gha,scope=image
          # min rather than max. max exports every intermediate layer of every
          # stage — including the Rust compiler's output — and the cache a
          # repository gets is finite, so a build that fills it evicts the very
          # layers the next one wanted. min keeps the final layers, which is
          # what a rebuild actually reuses.
          cache-to: type=gha,mode=min,scope=image

      - name: Build the coordinator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: coordinator
          push: false
          load: true
          tags: gameblade-coordinator:ci
          cache-from: type=gha,scope=image

      - name: Build the node image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: node
          push: false
          load: true
          tags: gameblade-node:ci
          cache-from: type=gha,scope=image

      - name: Build the relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: relay
          push: false
          load: true
          tags: gameblade-relay:ci
          cache-from: type=gha,scope=image

      # Every role, booted. The point is the roles rather than the code: an
      # image that has to be told what it is has one more way to be wrong, and
      # `/api/health` naming the role is what proves it was not.
      - name: Each image comes up as the thing its name says
        run: |
          set -euo pipefail

          wait_for_role() {
            name=$1 port=$2 expected=$3
            for _ in $(seq 1 45); do
              body=$(curl -fsS "http://127.0.0.1:$port/api/health" 2>/dev/null || true)
              if [ -n "$body" ]; then
                echo "$name: $body"
                echo "$body" | grep -q "\"role\":\"$expected\"" && return 0
                echo "$name: expected role $expected" >&2
                return 1
              fi
              sleep 2
            done
            echo "$name did not become healthy" >&2
            docker logs "$name" >&2
            return 1
          }

          # Standalone: no library configured, and it must still boot.
          docker run -d --name gameblade-ci -p 8080:8080 -e SCAN_ON_START=false gameblade:ci
          wait_for_role gameblade-ci 8080 standalone

          # The web client has to be in the image, not just the API.
          curl -fsS http://127.0.0.1:8080/ | grep -q '<base href='
          echo "web client served"

          # Coordinator: nothing passed at all. Its role is the image's.
          docker run -d --name gameblade-coordinator-ci -p 8081:8080 gameblade-coordinator:ci
          wait_for_role gameblade-coordinator-ci 8081 coordinator

          # Node: nothing passed either, and no coordinator to talk to. It must
          # come up, serve its setup page and wait — this is the state a node is
          # in for the minute between `docker compose up` and somebody filling
          # that page in, and it used to be a crash loop.
          docker run -d --name gameblade-node-ci -p 8082:8080 \
            -v "$PWD/.github:/library:ro" gameblade-node:ci
          wait_for_role gameblade-node-ci 8082 node

          curl -fsS http://127.0.0.1:8082/ | grep -q 'Set this node up'
          echo "node serves its setup page"

          # Both halves have to be alive: a node whose agent died is a node
          # that serves nothing while looking perfectly healthy.
          sleep 5
          docker exec gameblade-node-ci sh -c 'pgrep -f gameblade-node >/dev/null'
          echo "the mesh agent is running beside the server"

          # And it must still be up rather than restarting, which is what an
          # entrypoint that mishandles either process looks like.
          test "$(docker inspect -f '{{.State.Running}}' gameblade-node-ci)" = true
          echo "node is stable, not restarting"

          # Relay: with neither the coordinator's address nor its key it stops
          # and names both ways to give it one. Captured rather than piped,
          # because it exits non-zero on purpose and `pipefail` would read that
          # as the step failing.
          relay_says=$(docker run --rm gameblade-relay:ci 2>&1 || true)
          echo "relay: $relay_says"
          echo "$relay_says" | grep -q 'GAMEBLADE_SERVER'
          echo "$relay_says" | grep -q 'GAMEBLADE_COORDINATOR_KEY'
          echo "relay refuses to start unconfigured, and names both ways to fix it"

          # And with an address it waits for the coordinator rather than dying,
          # which is the ordinary case: the two start together and this one
          # routinely comes up first.
          docker run -d --name gameblade-relay-ci \
            -e GAMEBLADE_SERVER=http://127.0.0.1:9 gameblade-relay:ci
          sleep 6
          test "$(docker inspect -f '{{.State.Running}}' gameblade-relay-ci)" = true
          docker logs gameblade-relay-ci 2>&1 | grep -q 'waiting for the coordinator'
          echo "relay waits for a coordinator that is not up yet"

      - name: Clean up
        if: always()
        run: >-
          docker rm -f gameblade-ci gameblade-coordinator-ci gameblade-node-ci
          gameblade-relay-ci 2>/dev/null || true

  desktop:
    name: Build desktop client
    runs-on: windows-latest
    needs: changes
    # Built when the client's own code changed, and on demand.
    #
    # Not on every pull request: Windows minutes bill at twice the Linux rate
    # and a Tauri build is long even with LTO off below, so building one to
    # prove a change to the admin panel did not break it is money for nothing.
    # Not never, either — the client now links a Rust transport crate that the
    # Linux jobs never compile for Windows, and "it built on Linux" stopped
    # being evidence that it builds at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.desktop == 'true'
    env:
      # CI proves the client compiles and its tests pass; the installer it
      # produces is a by-product nobody installs. Full LTO through a single
      # codegen unit is most of what makes a release build take the best part of
      # an hour, so the gate goes without it. publish.yml keeps the shipping
      # settings, so what actually reaches users is unchanged.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json; setting it here
      # as well makes the action fail on a duplicate specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Set up in PowerShell rather than through dtolnay/rust-toolchain@stable,
      # which is a composite action whose every step runs under `shell: bash`.
      # A hosted runner does have bash, so the action would work here — this is
      # kept because it assumes nothing about the machine, which is what made it
      # necessary the last time these jobs ran somewhere else.
      - name: Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-WebRequest's progress bar makes a download take minutes
          # instead of seconds on Windows PowerShell.
          $ProgressPreference = 'SilentlyContinue'

          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Write-Host 'rustup is not on PATH; installing it for this account'
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }

            # Available to the rest of this step, and to every step after it.
            $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
            $env:PATH = "$cargoBin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $cargoBin -Encoding utf8
          }

          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install exited with $LASTEXITCODE" }

          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "rustup default exited with $LASTEXITCODE" }

          rustc --version
          cargo --version

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @gameblade/shared build

      - name: Rust formatting and lints
        working-directory: apps/desktop/src-tauri
        # This runner uses pwsh, which does not abort on a failing native
        # command, so each result is checked explicitly.
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installers
        run: pnpm --filter @gameblade/desktop build

      - uses: actions/upload-artifact@v4
        with:
          name: gameblade-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
