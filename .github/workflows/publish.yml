name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Cut a release at this version, e.g. 0.3.0. Leave blank to only refresh latest.'
        required: false
        type: string
      build_client:
        description: 'Build the Windows installers. Needs a Windows runner to be online.'
        required: false
        default: false
        type: boolean
      platforms:
        description: 'Server image architectures. arm64 is emulated and adds ~15 minutes.'
        required: false
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

# A versioned release gets its own lane. Sharing one group with ordinary pushes
# meant a release queued behind whatever was already building, and GitHub
# cancels a *queued* run when a newer one joins the same group — so a release
# could be silently killed before it started, which is exactly what happened.
concurrency:
  group: publish-${{ github.ref }}-${{ inputs.version || 'branch' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Push ${{ matrix.target }} image to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aio
            image: gameblade-aio
          - target: coordinator
            image: gameblade-coordinator
          - target: node
            image: gameblade-node
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Automatically provided; no personal access token needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            # A manually dispatched release has no tag ref for semver to read.
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # amd64 by default. There is no arm64 runner here, so that half is
          # built under QEMU — and better-sqlite3 has no musl prebuild, so an
          # emulated build compiles SQLite from source and takes ~15 minutes
          # instead of ~1. Nobody asked for arm64; it is opt-in for the run that
          # actually needs a Pi or an Ampere image.
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # min rather than max. max exports every intermediate layer of every
          # stage — including the Rust compiler's output — and the cache a
          # repository gets is finite, so a build that fills it evicts the very
          # layers the next one wanted. min keeps the final layers, which is
          # what a rebuild actually reuses.
          cache-to: type=gha,mode=min

  desktop:
    name: Build Windows installers
    # On a version tag, and on demand. Not on an ordinary push to main.
    #
    # A tag is the moment a release ships, and the server image and the client
    # that talks to it are one release — so a tagged build produces both without
    # anyone having to remember. Ordinary pushes do not, because Windows minutes
    # bill at twice the Linux rate and a release build with full LTO is long
    # enough that doing it per push would dominate the budget for something most
    # pushes never ship.
    #
    # `build_client` still forces it, for a release cut by hand from the
    # dispatch form rather than from a tag.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build_client
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Set up in PowerShell rather than through dtolnay/rust-toolchain@stable,
      # which is a composite action whose every step runs under `shell: bash`.
      # A hosted runner does have bash, so the action would work here — this is
      # kept because it assumes nothing about the machine, which is what made it
      # necessary the last time these jobs ran somewhere else.
      - name: Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-WebRequest's progress bar makes a download take minutes
          # instead of seconds on Windows PowerShell.
          $ProgressPreference = 'SilentlyContinue'

          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Write-Host 'rustup is not on PATH; installing it for this account'
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer
            & $installer -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }

            # Available to the rest of this step, and to every step after it.
            $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
            $env:PATH = "$cargoBin;$env:PATH"
            Add-Content -Path $env:GITHUB_PATH -Value $cargoBin -Encoding utf8
          }

          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install exited with $LASTEXITCODE" }

          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "rustup default exited with $LASTEXITCODE" }

          rustc --version
          cargo --version

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gameblade/shared build
      - run: pnpm --filter @gameblade/desktop build

      # Always available from the run's summary page, tag or not.
      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gameblade-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish the release
    # A public release comes from either a version tag or an explicit dispatch;
    # a plain main push just refreshes `latest` and leaves installers as
    # artifacts. The dispatch path exists because some environments cannot push
    # tag refs, and the release is then what creates the tag.
    #
    # `!cancelled()` rather than a bare condition, because `desktop` is now
    # opt-in: a job whose `needs` were skipped is skipped too by default, which
    # would have stopped releases happening at all rather than producing one
    # without installers.
    #
    # The two results spelled out are the ones that mean "nothing went wrong":
    # skipped is the normal path while the client is built by hand, success is
    # the path once a Windows runner is back. A desktop job that was asked for
    # and *failed* still blocks the release — publishing one silently missing
    # the installers somebody just asked to build is the wrong answer. `image`
    # must have succeeded outright; a broken server image must never ship a
    # release pointing at it.
    if: >-
      !cancelled() &&
      needs.image.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.version != ''))
    needs: [image, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Only when the desktop job actually ran. Downloading an artifact that
      # was never uploaded is an error, not an empty directory.
      - name: Fetch the installers built above
        if: needs.desktop.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gameblade-windows-installers
          path: installers

      - name: Show what was downloaded
        run: |
          if [ -d installers ]; then
            find installers -type f -printf '%s\t%p\n' | sort
          else
            echo "no installers in this run — build them with scripts/build-windows.ps1"
            echo "and attach them to the release by hand"
          fi

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

          # The git tag carries a leading v; the image tag does not, because
          # metadata-action's {{version}} strips it. Quoting the wrong one in
          # the release notes hands people a `docker pull` that 404s.
          echo "image_tag=${tag#v}" >> "$GITHUB_OUTPUT"

          # Docker refuses a repository name with uppercase in it, and
          # github.repository preserves the repo's casing. metadata-action
          # lowercases before pushing, so the notes must do the same to match
          # what actually exists in the registry.
          echo "image_root=${REGISTRY}/${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          # target_commitish only means anything while the tag is still being
          # created. Handing it a *different* commit for a tag that already
          # exists asks GitHub to move a published release, which the releases
          # API will not do; action-gh-release then falls back to looking the
          # release up by GITHUB_REF — a branch ref on a dispatch — and dies on
          # "No server is currently available to service your request". So the
          # commit is passed only when the tag is genuinely new, which lets a
          # re-dispatch correct an existing release's notes or assets in place.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "existing tag $tag found; leaving its commit alone"
            echo "commitish=" >> "$GITHUB_OUTPUT"
          else
            echo "commitish=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

          # The client paragraph depends on whether this run built installers.
          # Notes that say "download the .exe below" with no .exe below are
          # worse than notes that say where it actually is.
          if [ -d installers ]; then
            client='**Windows client** — download the `.exe` installer below. The `.msi` is there for deployment tooling; the `.exe` is what most people want.'
          else
            client='**Windows client** — not built by this run. Build it with `scripts/build-windows.ps1` and attach the `.exe` to this release.'
          fi
          # Written with echo rather than a heredoc so the delimiter lines are
          # never at the mercy of this block scalar's indentation.
          {
            echo 'client<<CLIENT_EOF'
            echo "$client"
            echo 'CLIENT_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Created from the current commit when it does not already exist.
          tag_name: ${{ steps.tag.outputs.name }}
          name: GameBlade ${{ steps.tag.outputs.name }}
          # Empty for a tag that already exists; see the resolve step above.
          target_commitish: ${{ steps.tag.outputs.commitish }}
          draft: false
          generate_release_notes: true
          # upload-artifact roots the archive at the least common ancestor of
          # the uploaded paths, so the installers arrive under nsis/ and msi/
          # subdirectories rather than at the top level. Recursive globs match
          # either shape.
          files: |
            installers/**/*.exe
            installers/**/*.msi
          # Enforced only when the desktop job actually ran: without it a glob
          # that matches nothing only warns, and a run that was supposed to
          # build installers goes green having attached none. When the client
          # is built by hand there is deliberately nothing to match.
          fail_on_unmatched_files: ${{ needs.desktop.result == 'success' }}
          body: |
            ## Install

            **Docker images** — choose the deployment shape from the README:

            ```
            docker pull ${{ steps.tag.outputs.image_root }}/gameblade-aio:${{ steps.tag.outputs.image_tag }}
            docker pull ${{ steps.tag.outputs.image_root }}/gameblade-coordinator:${{ steps.tag.outputs.image_tag }}
            docker pull ${{ steps.tag.outputs.image_root }}/gameblade-node:${{ steps.tag.outputs.image_tag }}
            ```

            Architectures in this build: `${{ inputs.platforms || 'linux/amd64' }}`.

            ${{ steps.tag.outputs.client }}

            The client connects to `archive.scopedd.lol` and no other server;
            just sign in with the account an invite created. After installing,
            set the client download URL in **Admin → Settings** so the landing
            page links this release.
