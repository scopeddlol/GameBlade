name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Automatically provided; no personal access token needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 covers a Raspberry Pi or an Ampere VPS as well as x86 servers.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Build Windows installers
    # Built on every main push as well as on tags: the server image and the
    # client that talks to it are one release, and an image published without a
    # matching installer leaves users nothing to connect with.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gameblade/shared build
      - run: pnpm --filter @gameblade/desktop build

      # Always available from the run's summary page, tag or not.
      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gameblade-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publish the release
    # Only a version tag produces a public release; a main push just refreshes
    # `latest` and leaves the installers as artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the installers built above
        uses: actions/download-artifact@v4
        with:
          name: gameblade-windows-installers
          path: installers

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            installers/*.exe
            installers/*.msi
          body: |
            ## Install

            **Server** — pull the image and follow the quick start in the README:

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            The image is published for `linux/amd64` and `linux/arm64`.

            **Windows client** — download the `.exe` installer below. The `.msi`
            is there for deployment tooling; the `.exe` is what most people want.

            Point the client at your server address and sign in with the account
            an invite created. After installing, set the client download URL in
            **Admin → Settings** so the landing page links this release.
