# A node: the game files, and nothing else.
#
# Runs wherever the library lives. Scans it, reports what it found to the
# coordinator, and serves game data straight to clients over QUIC so those bytes
# never cross the coordinator's connection.
#
# Two processes, one container. The server scans and reports; the mesh agent
# serves. They share a state file so they agree about which node they are, and
# the image starts both — a node is one thing to run, not a pair to keep in
# step.
#
# ---------------------------------------------------------------------------
# Setting one up
# ---------------------------------------------------------------------------
#
#   1. Mount your games at /library below and `docker compose up -d`.
#   2. Open http://<this machine>:8080.
#   3. Fill in the coordinator's address and an enrolment code from
#      Admin -> Nodes on the coordinator.
#
# That is the whole configuration. Nothing here needs editing except the volumes
# and, if you want it reachable from the LAN, the port binding. The answers from
# step 3 are written into ./data/node-state.json and survive restarts, so this
# never has to be told twice.
#
# ---------------------------------------------------------------------------
# More than one drive
# ---------------------------------------------------------------------------
#
# A node can hold as many libraries as it has disks. Mount each one under
# /libraries instead of at /library, and the directory name is the library's
# name on the coordinator:
#
#   - /mnt/3TB:/libraries/3TB:ro
#   - /mnt/E:/libraries/E:ro
#
# Both forms work together, and either can be used alone. What does *not* work
# is mounting two drives at the same /library — Docker keeps one of them and
# the other is simply not there, which is why this is two paths rather than
# two mounts of one.

services:
  node:
    image: ghcr.io/scopeddlol/gameblade-node:latest
    container_name: gameblade-node
    restart: unless-stopped

    environment:
      TZ: Etc/UTC
      # Scanning is the one thing worth tuning here. Everything else — the role,
      # the library path, where the identity lives — is baked into the image.
      SCAN_ON_START: 'true'
      SCAN_INTERVAL_MINUTES: '360'

      # A node hashes what it scanned by itself, because nothing else can ask
      # it to and nothing is servable until it has. Set false only if you would
      # rather schedule hours of disk reads yourself.
      # AUTO_CHUNK_HASH: 'false'

      # Declaring these skips the setup page, for an operator who would rather
      # not use it. Leave them out and the page asks instead.
      # COORDINATOR_URL: https://games.example.com
      # ENROLMENT_TOKEN: paste-once-then-remove

      # Library roots, if the mounts below are not where you want them. Set
      # this and it is exactly what gets scanned; leave it out and the mounts
      # decide, which is what the volumes below are written for.
      # LIBRARY_PATHS: /library,/mnt/extra

    volumes:
      # The node's identity, its local index, and nothing else worth keeping.
      # node-state.json in here is what makes this machine *this node* — copy it
      # if you ever move the node to different hardware.
      - ./data:/data
      # Your games. Read-only: a node serves these files and must never write to
      # them. Change the left-hand side; the right-hand side is where the image
      # looks.
      #
      # One library: mount it at /library.
      - /path/to/games:/library:ro
      # Several: one mount each under /libraries, named by the directory. Delete
      # the /library line above if you only want these.
      # - /mnt/3TB:/libraries/3TB:ro
      # - /mnt/E:/libraries/E:ro

    ports:
      # The node's own page: setup while it is unenrolled, then what it scanned,
      # whether it is reporting, and how much of it is servable.
      #
      # Bound to localhost by default because the page has no authentication of
      # its own. To reach it from the rest of your network, bind it to this
      # host's LAN address instead — '192.168.1.20:8080:8080' — which keeps it
      # off every other interface this machine has. For access from outside the
      # network, put a tunnel with its own authentication in front.
      - '127.0.0.1:8080:8080'

      # The mesh: where game bytes actually leave this machine. UDP, and
      # outbound-initiated, so no port forward is strictly required — but
      # forwarding this one at the router to this host is the single best thing
      # you can do for download reliability.
      - '47820:47820/udp'

    security_opt:
      - 'no-new-privileges:true'
