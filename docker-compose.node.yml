# GameBlade Node: one image and one lifecycle for scanning, enrollment, its
# management UI, and QUIC delivery. Open http://<node-host>:8081 on first run.

services:
  node:
    image: ghcr.io/scopeddlol/gameblade-node:latest
    container_name: gameblade-node
    restart: unless-stopped
    environment:
      ROLE: node
      DATA_DIR: /data
      LIBRARY_PATHS: /library
      # Both can be entered in the Node web UI instead. Environment values are
      # convenient for unattended deployments and seed the same runtime.
      COORDINATOR_URL: ${COORDINATOR_URL:-}
      ENROLMENT_TOKEN: ${ENROLMENT_TOKEN:-}
      SCAN_ON_START: ${SCAN_ON_START:-true}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-360}
      MESH_PORT: 47820
    volumes:
      - ./node-data:/data
      - ${LIBRARY_PATH:-/mnt/games}:/library:ro
    ports:
      - '${NODE_UI_PORT:-8081}:8080'
      # Each Coordinator/library pairing gets a stable consecutive port. This
      # default range supports 20 connections; publish more if you need them.
      - '47820-47839:47820-47839/udp'
    security_opt:
      - 'no-new-privileges:true'
