# A node: the game files, and nothing else.
#
# Runs wherever the library lives. Scans it, reports what it found to the
# coordinator, and serves game data straight to clients over QUIC so those bytes
# never cross the coordinator's connection.
#
# Two processes, one node. The server scans and reports; the mesh agent serves.
# They share a state file so they agree about which node they are.
#
# First run only: put the code from Admin → Settings → Nodes in ENROLMENT_TOKEN.
# It is spent immediately and can be removed afterwards — what identifies this
# node from then on is the key in ./data/node-state.json, which is the one file
# here worth keeping.

services:
  scanner:
    image: ghcr.io/scopeddlol/gameblade:latest
    container_name: gameblade-node
    restart: unless-stopped
    environment:
      ROLE: node
      DATA_DIR: /data
      LIBRARY_PATHS: /library
      COORDINATOR_URL: https://games.example.com
      # ENROLMENT_TOKEN: paste-once-then-remove
      SCAN_ON_START: 'true'
      SCAN_INTERVAL_MINUTES: '360'
    volumes:
      - ./data:/data
      # Read-only: a node serves this library and must never write to it.
      - /path/to/games:/library:ro
    # The node's own status page: what it scanned, whether it enrolled, when it
    # last reported. Bound to localhost because a node has nothing to say to the
    # public internet over HTTP - reach it through an SSH tunnel, or drop the
    # `127.0.0.1` if this host is somewhere only you can reach.
    ports:
      - '127.0.0.1:8080:8080'

  mesh:
    image: ghcr.io/scopeddlol/gameblade:latest
    container_name: gameblade-mesh
    restart: unless-stopped
    entrypoint: ['/sbin/tini', '--']
    command: ['gameblade-node']
    environment:
      GAMEBLADE_SERVER: https://games.example.com
      GAMEBLADE_LIBRARY: /library
      GAMEBLADE_STATE: /data/node-state.json
      GAMEBLADE_PORT: '47820'
    volumes:
      - ./data:/data
      - /path/to/games:/library:ro
    # UDP, and outbound-initiated: no port forward is needed. Publishing it is
    # only useful if this host happens to be directly reachable.
    ports:
      - '47820:47820/udp'
