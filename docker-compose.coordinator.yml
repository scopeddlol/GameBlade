# The coordinator: everything except the game files.
#
# Runs on the VPS. Holds the database, the admin panel, the landing page and the
# API, and knows which nodes hold what — but stores no game data itself, which
# is what makes it fit on a small host. Nodes report their catalogs to it and
# serve bytes straight to clients.
#
# Moving an existing GameBlade here is a copy, not a migration: stop the old
# container, copy its `data/` directory to this host, start this. The database
# file is the same file, opened by the same code.

services:
  gameblade:
    image: ghcr.io/scopeddlol/gameblade:latest
    container_name: gameblade-coordinator
    restart: unless-stopped
    environment:
      # No local library and no scanning: the role switches scanning off, since
      # a coordinator's libraries are records of what its nodes hold rather
      # than folders it can read. The catalog arrives from nodes.
      ROLE: coordinator
      DATA_DIR: /data
      # Behind a reverse proxy that terminates TLS. Required: without it every
      # request appears to come from the proxy, and rate limiting buckets every
      # player together.
      TRUST_PROXY: 'true'
    volumes:
      - ./data:/data
    # Published for a reverse proxy on this host. Bind it to loopback when that
    # proxy is here too, or drop the block entirely and let a proxy on a shared
    # Docker network reach it by service name.
    ports:
      - '127.0.0.1:8080:8080'
