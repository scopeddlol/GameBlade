# The public Coordinator. It holds the database and UI, tracks which Nodes have
# each game, requests verified chunks over authenticated outbound HTTPS, and
# streams those chunks to Desktop clients over HTTPS.
#
# Put your existing reverse proxy (Caddy, Pangolin, Cloudflare Tunnel, etc.) in
# front of port 8080. Nodes require no inbound port and no UDP service.

services:
  coordinator:
    image: ghcr.io/scopeddlol/gameblade-coordinator:latest
    container_name: gameblade-coordinator
    restart: unless-stopped

    environment:
      TZ: Etc/UTC
      TRUST_PROXY: 'true'
      SECURE_COOKIES: auto

      # Optional only while the database has no accounts. Leave unset to create
      # the first administrator through the web UI.
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me-to-something-long

      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}

    volumes:
      - ./data:/data

    # Suitable for a reverse proxy on this host. For a proxy on a shared Docker
    # network, remove this mapping and route directly to coordinator:8080.
    ports:
      - '127.0.0.1:8080:8080'

    security_opt:
      - 'no-new-privileges:true'
