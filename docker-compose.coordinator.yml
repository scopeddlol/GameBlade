# The coordinator: everything except the game files.
#
# Runs on the VPS. Holds the database, the admin panel, the landing page and the
# API, and knows which nodes hold what — but stores no game data itself, which is
# what makes it fit on a small host. Nodes report their catalogs to it and serve
# bytes straight to clients.
#
# The image is the role. There is no ROLE variable here because pulling
# `gameblade-coordinator` has already said what this is, and saying it twice is
# a thing to get wrong. It will not scan, because a coordinator has nothing to
# scan; the scanning settings are ignored and it says so in the log.
#
# Moving an existing GameBlade here is a copy, not a migration: stop the old
# container, copy its `data/` directory to this host, start this. The database
# file is the same file, opened by the same code.

services:
  coordinator:
    image: ghcr.io/scopeddlol/gameblade-coordinator:latest
    container_name: gameblade-coordinator
    restart: unless-stopped

    environment:
      TZ: Etc/UTC

      # Required behind a reverse proxy. Without it every request appears to
      # come from the proxy, which breaks per-client rate limiting and logs the
      # wrong address for everyone.
      TRUST_PROXY: 'true'
      # 'auto' marks session cookies Secure when the proxy reports https.
      SECURE_COOKIES: auto

      # Optional, and only while the database has no accounts. Leave both unset
      # to create the first administrator through the web UI instead.
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me-to-something-long

      # Optional public relay override. Left empty, clients use the coordinator
      # request hostname and UDP port 47821, which matches the relay below. Set
      # this only when the relay has a different public name or port.
      RELAY_ENDPOINT: ${RELAY_ENDPOINT:-}

      # Metadata providers. Can also be set in Admin -> Settings.
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}

    volumes:
      # The only thing here that cannot be recreated, and it is small: no game
      # file ever passes through this host. Back it up.
      - ./data:/data

    # Bound to loopback for a reverse proxy on this same host. If the proxy is
    # in Docker on a shared network, remove this block entirely and point it at
    # `coordinator:8080` instead, so nothing is exposed on the host at all.
    ports:
      - '127.0.0.1:8080:8080'

    security_opt:
      - 'no-new-privileges:true'
  # The path for clients whose NAT defeats hole punching.
  #
  # Not optional here, and that is the point. On one machine a client that
  # cannot reach a node downloads from the server instead and nobody notices.
  # A coordinator holds no game files, so there is no such fallback: without
  # this, a player behind a symmetric or carrier-grade NAT cannot download
  # anything, ever, and it looks like a broken archive rather than a network
  # they are behind.
  #
  # It costs almost nothing to have running and unused. Only clients that
  # already failed to connect directly are ever sent here, relayed bytes count
  # against the same allowance as any others, and GAMEBLADE_RELAY_MAX caps how
  # many can be in flight.
  relay:
    image: ghcr.io/scopeddlol/gameblade-relay:latest
    container_name: gameblade-relay
    restart: unless-stopped
    depends_on:
      - coordinator

    environment:
      # It fetches the coordinator's public key from here itself, waiting for
      # it to come up. That key is all it is ever given: no database, no
      # credentials, no API. It never terminates TLS and never learns which
      # game is moving through it.
      GAMEBLADE_SERVER: http://coordinator:8080
      GAMEBLADE_RELAY_MAX: '256'

    ports:
      # UDP, and not something a reverse proxy can carry — Caddy has nothing to
      # do with this. Open 47821/udp on the host firewall, and make sure
      # RELAY_ENDPOINT overrides this automatic same-host address when needed.
      - '47821:47821/udp'

    security_opt:
      - 'no-new-privileges:true'
