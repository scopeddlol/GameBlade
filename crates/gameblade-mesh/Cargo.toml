[package]
name = "gameblade-mesh"
version = "0.5.3"
description = "Direct node-to-client transport for GameBlade"
edition = "2021"
rust-version = "1.77.2"

# Deliberately standalone rather than part of the desktop crate.
#
# The client and the node agent both need this, and the agent has no business
# pulling in a GUI toolkit to serve files. Keeping it separate also means it
# compiles and tests in seconds on any platform, which the Tauri crate does not.
[dependencies]
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-aws-lc-rs",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tempfile = "3"
async-trait = "0.1"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
