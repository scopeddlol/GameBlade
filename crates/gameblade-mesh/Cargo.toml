[package]
name = "gameblade-mesh"
version = "0.6.8"
description = "Direct node-to-client transport for GameBlade"
edition = "2021"
rust-version = "1.77.2"

# Deliberately standalone rather than part of the desktop crate.
#
# The client and the node agent both need this, and the agent has no business
# pulling in a GUI toolkit to serve files. Keeping it separate also means it
# compiles and tests in seconds on any platform, which the Tauri crate does not.
[dependencies]
# ring rather than aws-lc-rs, and the choice is about the build rather than the
# cryptography. rcgen and reqwest both pull ring regardless, so asking rustls and
# quinn for aws-lc-rs meant compiling two C and assembly crypto libraries to do
# one job — the larger of which dominated the build.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
# Only for one thing std cannot express: clearing IPV6_V6ONLY before the bind,
# so a node's `[::]` socket answers IPv4 on Windows as it already did on Linux.
# quinn and tokio both pull it in regardless, so it costs nothing to compile.
socket2 = "0.6"
# "fs" and "rt-multi-thread" are needed by the node agent binary. They were
# once only in dev-dependencies, where feature unification made `cargo test`
# compile happily while a real `cargo build` of the binary failed — so the
# non-test build is part of the checks now, not just the tests.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "sync",
    "time",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

# The agent talks to the coordinator over ordinary HTTPS, through the same
# proxy everything else uses.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# ---------------------------------------------------------------------------
# The shipped binaries.
#
# This crate is the reason the transfer path is in Rust at all: it hashes every
# chunk on the way out and again on the way in, and moves game data at whatever
# the disk and the link will carry. The default release profile leaves most of
# that on the table — sixteen codegen units means the optimiser never sees
# across them, and without LTO it never sees across crates either, which is
# where quinn, rustls and sha2 actually live.
#
# It costs build time, once, on a machine that is not yours.
# ---------------------------------------------------------------------------
[profile.release]
lto = "fat"
codegen-units = 1
# Kept: a node that panics mid-transfer should say where, in a log somebody
# reads later. `panic = "abort"` would trade that for a little more speed and a
# stripped stack, which is the wrong way round for a background service.
panic = "unwind"
strip = "debuginfo"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tempfile = "3"
async-trait = "0.1"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
